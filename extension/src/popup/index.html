<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
      body {
        width: 340px;
        background: #f4f8f6;
        color: #10231c;
        font-size: 13px;
      }
      .wrap { padding: 16px 16px 14px; }
      .head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
      .logo {
        width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 20px; font-style: italic; color: #fff;
        background: linear-gradient(135deg,#047857,#059669);
        box-shadow: 0 8px 20px rgba(4,120,87,.35);
      }
      h1 { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
      .sub { font-size: 11px; color: #5b6b64; margin-top: 1px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .site {
        position: relative;
        background: #ffffff;
        border: 1px solid #e3e8e6;
        border-radius: 14px;
        padding: 14px 12px 12px;
        text-align: left;
        color: #10231c;
        cursor: pointer;
        transition: transform .12s, box-shadow .15s, border-color .15s;
        overflow: hidden;
      }
      .site:hover {
        border-color: rgba(5,150,105,.5);
        box-shadow: 0 8px 20px rgba(15,23,42,.08);
        transform: translateY(-2px);
      }
      .site:active { transform: translateY(0); }
      .site img {
        width: 28px; height: 28px; border-radius: 8px;
        background: #fff;
        border: 1px solid #e3e8e6;
        padding: 4px;
        margin-bottom: 8px;
        display: block;
      }
      .site .name { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
      .site .desc { font-size: 10.5px; color: #5b6b64; margin-top: 2px; line-height: 1.4; }
      .site .arrow {
        position: absolute; right: 10px; top: 10px;
        width: 18px; height: 18px;
        border-radius: 6px;
        background: rgba(5,150,105,.08);
        display: flex; align-items: center; justify-content: center;
        font-size: 11px; color: #047857;
      }
      button.primary, button.secondary {
        width: 100%; margin-top: 12px; padding: 11px; border: none; border-radius: 10px;
        font-weight: 700; font-size: 12.5px; letter-spacing: .03em; color: #fff;
        cursor: pointer;
        transition: transform .12s, filter .15s;
      }
      button.primary {
        background: linear-gradient(135deg,#047857,#059669);
        box-shadow: 0 10px 24px rgba(4,120,87,.3);
      }
      button.secondary {
        background: #ffffff;
        color: #1f2b26;
        border: 1px solid #d5ddd9;
        margin-top: 10px;
      }
      button:hover { filter: brightness(1.05); transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      button:focus-visible { outline: 2px solid #059669; outline-offset: 2px; }
      .status { margin-top: 10px; font-size: 11px; color: #047857; text-align: center; min-height: 14px; }
      @media (prefers-reduced-motion: reduce) {
        .site, button { transition: none; transform: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <div class="logo">V</div>
        <div>
          <h1>Vyntra Prospector</h1>
          <div class="sub">Escolha onde prospectar</div>
        </div>
      </div>

      <div class="grid">
        <button class="site" data-url="https://wepsy.com.br/catalogo">
          <span class="arrow">↗</span>
          <img src="https://www.google.com/s2/favicons?domain=wepsy.com.br&amp;sz=64" alt="" />
          <div class="name">Wepsy</div>
          <div class="desc">Psicólogos com WhatsApp público</div>
        </button>
        <button class="site" data-url="https://www.webmotors.com.br/carros">
          <span class="arrow">↗</span>
          <img src="https://www.google.com/s2/favicons?domain=webmotors.com.br&amp;sz=64" alt="" />
          <div class="name">WebMotors</div>
          <div class="desc">Lojas e concessionárias</div>
        </button>
        <button class="site" data-url="https://www.airbnb.com.br/">
          <span class="arrow">↗</span>
          <img src="https://www.google.com/s2/favicons?domain=airbnb.com.br&amp;sz=64" alt="" />
          <div class="name">Airbnb</div>
          <div class="desc">Anfitriões (tel. na descrição)</div>
        </button>
        <button class="site" data-url="https://www.google.com.br/maps">
          <span class="arrow">↗</span>
          <img src="https://www.google.com/s2/favicons?domain=google.com.br&amp;sz=64" alt="" />
          <div class="name">Google Maps</div>
          <div class="desc">Empresas locais</div>
        </button>
      </div>

      <button id="openHere" class="secondary">Abrir nesta página</button>
      <div class="status" id="status"></div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
