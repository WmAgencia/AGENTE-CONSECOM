<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; margin: 0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
      body { width: 320px; background: #10071d; color: #e9e4f4; font-size: 13px; }
      .wrap { padding: 16px; }
      .head { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
      .logo {
        width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 20px; font-style: italic; color: #fff;
        background: linear-gradient(135deg,#8b5cf6,#a855f7);
        box-shadow: 0 8px 20px rgba(139,92,246,.4);
      }
      h1 { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
      .sub { font-size: 11px; color: #8d82a8; margin-top: 1px; }
      label { display: block; font-size: 11px; color: #8d82a8; margin: 12px 0 4px; }
      input {
        width: 100%; padding: 9px 11px;
        background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px; color: #e9e4f4; font-size: 12px; outline: none;
        transition: border-color .15s;
      }
      input:focus { border-color: #8b5cf6; }
      input::placeholder { color: #5d5378; }
      button {
        width: 100%; margin-top: 12px; padding: 11px; border: none; border-radius: 10px;
        font-weight: 700; font-size: 12.5px; letter-spacing: .03em; color: #fff;
        background: linear-gradient(135deg,#8b5cf6,#a855f7); cursor: pointer;
        box-shadow: 0 10px 24px rgba(139,92,246,.35);
        transition: transform .12s, filter .15s;
      }
      button.secondary { background: rgba(255,255,255,0.08); margin-top: 8px; box-shadow: none; }
      button:hover { filter: brightness(1.1); transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      .status { margin-top: 10px; font-size: 11px; color: #34d399; text-align: center; min-height: 14px; }
      .hint {
        margin-top: 14px; padding: 10px 12px;
        background: rgba(139,92,246,0.1); border: 1px solid rgba(139,92,246,0.2);
        border-radius: 10px; font-size: 11px; color: #8d82a8; line-height: 1.6;
      }
      .hint b { color: #c4b5fd; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <div class="logo">V</div>
        <div>
          <h1>Vyntra Prospector</h1>
          <div class="sub">Captura de leads do Google Maps</div>
        </div>
      </div>

      <label>URL do projeto Supabase</label>
      <input id="url" placeholder="https://xxxx.supabase.co" spellcheck="false" />
      <label>Chave anon (publishable)</label>
      <input id="key" placeholder="eyJhbGci..." spellcheck="false" />
      <label>Access token da sessão Vyntra</label>
      <input id="token" placeholder="Cole o token copiado do painel" spellcheck="false" type="password" />
      <button id="save">Salvar configuração</button>
      <button id="open" class="secondary">Abrir painel no Maps</button>
      <div class="status" id="status"></div>
      <div class="hint">
        Abra o <b>Google Maps</b>, faça uma busca (ex.: &quot;clínicas odontológicas em Sorocaba&quot;),
        role a lista e toque em <b>PROSPECTAR</b> no painel para importar as empresas.
      </div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
